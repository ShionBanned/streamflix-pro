name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install Root Dependencies
        run: npm install

      - name: Install Backend Dependencies
        run: npm ci || npm install
        working-directory: backend

      - name: Install Frontend Dependencies
        run: npm ci || npm install
        working-directory: frontend

      - name: Code Quality & Linting
        run: npm run lint

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Backend Test Suite (38 tests)
        run: npm run test:backend

      - name: Frontend Test Suite
        run: npm run test:frontend

      - name: Desktop Updater Engine & E2E Tests
        run: npm run test:updater

      - name: Compile Frontend Production Bundle (Vite)
        run: npm run build:frontend
